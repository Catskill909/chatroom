[supervisord]
nodaemon=true

[program:mongod]
command=/opt/mongodb/bin/mongod --dbpath /data/db --bind_ip 127.0.0.1 --port 27017
autorestart=true
startsecs=5
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:app]
command=node /app/server.js
directory=/app
environment=NODE_ENV="production"
autorestart=true
startsecs=5
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
