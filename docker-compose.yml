version: '3.8'

services:
  app:
    build: .
    container_name: chatapp
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/chatapp
    depends_on:
      - mongodb
    restart: unless-stopped
    volumes:
      # Persist user uploads (audio and cover) across restarts
      - ./uploads:/app/uploads

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
